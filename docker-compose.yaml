version: '3'
services:
  school-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: school-api:1.0.0
    container_name: school-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://admin:password@postgres-db:5432/school?schema=public"
    depends_on:
      postgres-db:
        condition: service_healthy

  postgres-db:
    container_name: postgres
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: school
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
